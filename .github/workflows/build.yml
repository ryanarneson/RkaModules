name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  rack-sdk-version: 2.6.6
  rack-plugin-toolchain-dir: /home/build/rack-plugin-toolchain

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plugin.mk (and so the Rack SDK) isn't needed for the tests, so build
      # them directly rather than through the Makefile.
      - name: DSP unit tests
        run: |
          for t in src/*/test_*.cpp; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc -I"$(dirname "$t")" "$t" -o "${t%.cpp}"
            "./${t%.cpp}"
          done

  build:
    name: ${{ matrix.platform }}
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bloodbat/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build plugin
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          pushd ${{ env.rack-plugin-toolchain-dir }}
          make plugin-build-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          path: ${{ env.rack-plugin-toolchain-dir }}/plugin-build
          name: ${{ matrix.platform }}

  build-mac:
    name: mac-${{ matrix.platform }}
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get Rack SDK
        run: |
          cd $HOME
          curl -sSfL -o Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-${{ matrix.platform }}.zip
          unzip -q Rack-SDK.zip
      - name: Build plugin
        run: |
          CROSS_COMPILE_TARGET_x64=x86_64-apple-darwin
          CROSS_COMPILE_TARGET_arm64=arm64-apple-darwin
          export RACK_DIR=$HOME/Rack-SDK
          export CROSS_COMPILE=$CROSS_COMPILE_TARGET_${{ matrix.platform }}
          make dep
          make dist
      - uses: actions/upload-artifact@v4
        with:
          path: dist/*.vcvplugin
          name: mac-${{ matrix.platform }}

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: _artifacts/**/*.vcvplugin
